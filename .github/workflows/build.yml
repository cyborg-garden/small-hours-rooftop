name: build

on:
  push:
    branches: [main]

permissions:
  contents: write

# One publisher at a time: overlapping runs force-push "built", so an older
# run finishing late could overwrite a newer build. Newest wins, always.
concurrency:
  group: publish-built
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # esbuild and three are all the build needs. Playwright's browser is
      # for the gates in tools/, which are run before a push, not here.
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build
        run: node tools/build.mjs --site

      - name: Check the page against the arcade's rules
        run: node tools/rules.mjs

      - name: Publish site as orphan branch "built"
        run: |
          cd site
          git init -b built
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: publish site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" built
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
